name: Build Synch App
on:
  push:
    paths: ['synch/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['synch/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/launcher.test.mjs
      - run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t synch-ha:0.1.0-test synch
      - run: python3 tests/smoke.py synch-ha:0.1.0-test
